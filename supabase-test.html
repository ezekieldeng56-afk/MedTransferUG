<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MedTransfer Login Test</title>
</head>

<body>

<h2>MedTransfer Login Test</h2>

<input
    type="email"
    id="email"
    placeholder="Manager Email">

<br><br>

<input
    type="password"
    id="password"
    placeholder="Password">

<br><br>

<button id="loginButton">Test Login</button>

<p id="result">Checking Supabase...</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const result = document.getElementById("result");

if (!window.supabase) {

    result.textContent =
        "❌ Supabase library did not load.";

} else {

    result.textContent =
        "✅ Supabase library loaded. Ready to test.";

    const SUPABASE_URL =
        "https://fmhvcjidqpeyywylsqzy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_2QjZptN6qnDQs_N9I6aAvw_ncY2iD33";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    document.getElementById("loginButton").addEventListener(
        "click",
        async function () {

            result.textContent = "⏳ Checking login...";

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            if (!email || !password) {

                result.textContent =
                    "⚠️ Enter both email and password.";

                return;
            }

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {

                result.textContent =
                    "❌ Login failed: " + error.message;

                return;
            }

            result.textContent =
                "✅ Supabase login successful!";
        }
    );
}
</script>

</body>
</html>
